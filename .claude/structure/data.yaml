# data/ structure detail
module: tally-reading
directory: src/data/
description: >
  Books data-access layer. D1-only — src/data/index.js throws without the
  READING_MANAGER_DB binding. The former KV and JSON book providers were
  deleted in audit cycle 15 (2026-06): they implemented only the books
  interface while everything else talked to D1 directly, so local "json mode"
  silently diverged from production. Local dev uses a local D1 database
  (`npm run seed:local`).
  KV (READING_MANAGER_KV) is still used for caching and the legacy
  shared-password mode via services/kvService.js — just not as a books store.

files:
  index.js:
    description: >
      Books provider factory. Throws when env.READING_MANAGER_DB is absent;
      otherwise returns an object whose methods delegate to d1Provider with
      env bound. Kept async for call-site compatibility.
    exports:
      - name: createProvider
        kind: function
        params: [{name: env, type: object, default: null}]
        returns: Promise<object>
        description: Returns the D1-backed books provider; throws without the D1 binding
    imports:
      - from: ./d1Provider.js
        items: ['*']

  d1Provider.js:
    description: SQL-based storage using Cloudflare D1; optimized for 18,000+ books with FTS5
    exports:
      - name: getAllBooks
        kind: function
        params: [{name: env}]
        returns: Promise<Array>
        description: Retrieve all books (no org filter)
      - name: getBooksByOrganization
        kind: function
        params: [{name: env}, {name: organizationId}]
        returns: Promise<Array>
        description: Books linked to org via org_book_selections JOIN
      - name: getBookById
        kind: function
        params: [{name: env}, {name: id}]
        returns: Promise<object|null>
      - name: addBook
        kind: function
        params: [{name: env}, {name: book}]
        returns: Promise<object>
      - name: updateBook
        kind: function
        params: [{name: env}, {name: id}, {name: book}]
        returns: Promise<object>
      - name: deleteBook
        kind: function
        params: [{name: env}, {name: id}]
        returns: Promise<object>
      - name: addBooksBatch
        kind: function
        params: [{name: env}, {name: books}]
        returns: Promise<Array>
        description: Bulk insert with auto-chunking (max 100 per batch)
      - name: updateBooksBatch
        kind: function
        params: [{name: env}, {name: updates}]
        returns: Promise<Array>
        description: Bulk update with auto-chunking
      - name: searchBooks
        kind: function
        params: [{name: env}, {name: query}, {name: limit}]
        returns: Promise<Array>
        description: FTS5 full-text search with LIKE fallback
      - name: getBooksPaginated
        kind: function
        params: [{name: env}, {name: page}, {name: pageSize}]
        returns: "Promise<{books, total, page, pageSize, totalPages}>"
      - name: getBookCount
        kind: function
        params: [{name: env}]
        returns: Promise<number>
      - name: getFilteredBooksForRecommendations
        kind: function
        params: [{name: env}, {name: options}]
        returns: Promise<Array>
        description: SQL pre-filter by reading level, genres, excluded books with randomization
      - name: READING_LEVEL_MAP
        kind: object
        description: "Map reading level strings to numeric values {beginner:1..expert:6}"

  demoSnapshot.js:
    description: >
      Generated seed data for the public demo organisation (~31k lines) —
      row arrays consumed by services/demoReset.js. Regenerated by
      scripts/export-demo-snapshot.js; not hand-edited.
